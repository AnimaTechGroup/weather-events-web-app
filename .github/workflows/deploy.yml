name: Deploy Terra Stats

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-terra-stats
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          VITE_GOLD_API_URL: ${{ secrets.VITE_GOLD_API_URL }}
          VITE_GOLD_API_KEY: ${{ secrets.VITE_GOLD_API_KEY }}
          VITE_DATA_MODE: lake

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Publish to S3 + invalidate CloudFront
        env:
          BUCKET: game-data-meridian-development-3ad19777
          DISTRIBUTION: E1DRF1UUIFJCGV
        run: |
          aws s3 sync dist/ "s3://${BUCKET}/" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*"
